gpu_stats
 gpu_temp
cpu_stats
 cpu_temp
io_read
vram
ram
fps
 frametime
 fps_metrics=0.01
 frame_timing
present_mode

# Overlay
toggle_hud=Shift_R+F12
no_display
gpu_text=9070xt
toggle_fps_limit=Shift_L+F12
fps_limit=0

# Matugen Generated Colors material you

# Stats
gpu_color={{colors.primary.default.hex_stripped}}
cpu_color={{colors.secondary.default.hex_stripped}}
vram_color={{colors.tertiary.default.hex_stripped}}
ram_color={{colors.secondary_fixed.default.hex_stripped}}

# Engine / API
engine_color={{colors.error.default.hex_stripped}}
wine_color={{colors.error.default.hex_stripped}}

# IO / Network / Media
io_color={{colors.primary_container.default.hex_stripped}}
network_color={{colors.tertiary_container.default.hex_stripped}}
media_player_color={{colors.primary.default.hex_stripped}}

# Timing
frametime_color={{colors.on_surface.default.hex_stripped}}

# Text / Background
text_color={{colors.on_surface.default.hex_stripped}}
background_color={{colors.surface.default.hex_stripped}}
horizontal_separator_color={{colors.outline.default.hex_stripped}}

# Battery
battery_color={{colors.secondary_fixed.default.hex_stripped}}

# Font
font_file=/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf
font_size=24

# Layout
text_outline_thickness=0
round_corners=10
