font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14

# Colors
# foreground #979eab
# background #282c34
# cursor #cccccc
# color0 #282c34
# color1 #e06c75
# color2 #98c379
# color3 #e5c07b
# color4 #61afef
# color5 #be5046
# color6 #56b6c2
# color7 #979eab
# color8 #393e48
# color9 #d19a66
# color10 #56b6c2
# color11 #e5c07b
# color12 #61afef
# color13 #be5046
# color14 #56b6c2
# color15 #abb2bf
# selection_foreground #282c34
# selection_background #979eab

enable_audio_bell no
confirm_os_window_close 0

shell zsh
shell_integration disabled

cursor_shape beam
# smooth cursor
cursor_trail 1
cursor_trail_start_threshold 0


url_style curly

remember_window_size no

window_padding_width 8

cursor_blink_interval 0

background_opacity 0.8
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

sync_to_monitor no

# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME
